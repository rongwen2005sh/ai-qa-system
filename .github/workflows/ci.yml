# 工作流的名称，会显示在 GitHub Actions 的 UI 界面中
name: CI/CD for AI QA System

# 工作流的触发条件
on:
  # 当有代码推送到 main 分支时触发
  push:
    branches: ["aliyun"]
  # 当有针对 main 分支的 Pull Request 被创建或更新时触发
  pull_request:
    branches: ["aliyun"]

# 定义工作流中的所有任务 (Jobs)
jobs:
  # --- 第一个任务：构建并测试后端微服务 ---
  build-and-test-backend:
    # 任务的名称，会显示在 UI 中
    name: Build and Test Backend Services
    # 运行此任务所需的虚拟机环境
    runs-on: ubuntu-latest

    # 任务的执行步骤
    steps:
      # 步骤 1: 检出代码
      # 使用官方的 actions/checkout@v4 action 来获取仓库的最新代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 设置 Java 环境
      # 使用官方的 actions/setup-java@v4 action 来安装和配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 步骤 3: 缓存 Maven 依赖
      # 为了加速构建，缓存下载过的 Maven 依赖包。
      # 这样下次构建时，如果 pom.xml 没有变化，就可以直接使用缓存，节省大量时间。
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 步骤 4: 使用 Maven 构建和测试
      # -B: Batch mode，避免交互式提示
      # clean package: 执行清理、编译、测试、打包等所有操作
      - name: Build with Maven
        run: |
          cd backend-services
          # 使用父pom.xml构建所有子模块
          mvn -B clean package

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: |
            backend-services/api-gateway/target/*.jar
            backend-services/user-service/target/*.jar
            backend-services/qa-service/target/*.jar
          retention-days: 1

  # --- 第二个任务：构建 Docker 镜像并直接传输到ECS ---
  build-and-transfer-images:
    # 任务的名称
    name: Build and Transfer Docker Images
    # 运行此任务所需的虚拟机环境
    runs-on: ubuntu-latest

    # 依赖关系：这个任务必须在 `build-and-test-backend` 成功完成后才能开始
    needs: build-and-test-backend

    # 任务的执行步骤
    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-artifacts
          path: backend-services

      # 步骤 2: 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 3: 构建 Docker 镜像（不推送）
      - name: Build API Gateway image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-api-gateway:latest ./backend-services/api-gateway

      - name: Build User Service image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-user-service:latest ./backend-services/user-service

      - name: Build QA Service image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-qa-service:latest ./backend-services/qa-service

      - name: Build Frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-frontend:latest \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://101.132.34.91:8080 \
            ./frontend-nextjs/frontend

      # 步骤 4: 保存 Docker 镜像为 tar 文件
      - name: Save Docker images to tar files
        run: |
          docker save -o api-gateway.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-api-gateway:latest
          docker save -o user-service.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-user-service:latest
          docker save -o qa-service.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-qa-service:latest
          docker save -o frontend.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-frontend:latest
          echo "=== 生成的镜像文件 ==="
          ls -lh *.tar

      # 步骤 5: 上传 docker-compose.yml 到 ECS 服务器
      - name: Upload docker-compose.yml to Aliyun ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/aiqasystem-cicd/"
          overwrite: true

      # 步骤 6: 上传 Docker 镜像文件到 ECS
      - name: Upload Docker images to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "*.tar"
          target: "~/aiqasystem-cicd/"

      # 步骤 7: 部署到 Aliyun ECS 服务器
      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/aiqasystem-cicd

            echo "=== 检查传输的镜像文件 ==="
            ls -lh *.tar

            # 停止所有容器
            echo "停止所有容器..."
            docker-compose down --volumes --remove-orphans

            # 加载应用镜像
            echo "加载应用镜像..."
            docker load -i api-gateway.tar && echo "✅ API Gateway 镜像加载成功"
            docker load -i user-service.tar && echo "✅ User Service 镜像加载成功"
            docker load -i qa-service.tar && echo "✅ QA Service 镜像加载成功"
            docker load -i frontend.tar && echo "✅ Frontend 镜像加载成功"

            # 检查MySQL镜像是否存在，不存在则尝试拉取
            echo "检查MySQL镜像..."
            if ! docker images mysql:8.0 | grep -q "mysql"; then
              echo "MySQL镜像不存在，尝试拉取..."
              # 尝试多个国内镜像源
              docker pull hub-mirror.c.163.com/library/mysql:8.0 && \
                docker tag hub-mirror.c.163.com/library/mysql:8.0 mysql:8.0 && \
                echo "✅ MySQL 镜像拉取成功" || \
                docker pull mirror.baidubce.com/library/mysql:8.0 && \
                docker tag mirror.baidubce.com/library/mysql:8.0 mysql:8.0 && \
                echo "✅ MySQL 镜像拉取成功" || \
                echo "❌ MySQL 镜像拉取失败，请手动处理"
            else
              echo "✅ MySQL 镜像已存在，跳过拉取"
            fi

            # 检查所有镜像是否就绪
            echo "=== 当前所有镜像 ==="
            docker images

            # 启动服务
            echo "启动所有服务..."
            docker-compose up -d

            # 等待服务启动
            sleep 10

            # 检查服务状态
            echo "=== 服务状态 ==="
            docker-compose ps

            echo "=== 关键服务健康检查 ==="
            # 检查MySQL是否就绪
            echo "检查MySQL连接..."
            if docker exec ai-qa-mysql-db mysqladmin ping -h localhost --silent; then
              echo "✅ MySQL 连接正常"
            else
              echo "⚠️ MySQL 连接检查失败，可能还在启动中"
              sleep 10
              if docker exec ai-qa-mysql-db mysqladmin ping -h localhost --silent; then
                echo "✅ MySQL 连接正常（第二次检查）"
              else
                echo "❌ MySQL 连接失败"
              fi
            fi

            # 检查应用服务健康
            echo "检查应用服务..."
            for i in {1..3}; do
              if curl -f http://localhost:8081/actuator/health >/dev/null 2>&1; then
                echo "✅ User Service 健康"
                break
              elif [ $i -eq 3 ]; then
                echo "❌ User Service 健康检查失败"
              else
                sleep 5
              fi
            done

            for i in {1..3}; do
              if curl -f http://localhost:8082/actuator/health >/dev/null 2>&1; then
                echo "✅ QA Service 健康"
                break
              elif [ $i -eq 3 ]; then
                echo "❌ QA Service 健康检查失败"
              else
                sleep 5
              fi
            done

            for i in {1..3}; do
              if curl -f http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "✅ API Gateway 健康"
                break
              elif [ $i -eq 3 ]; then
                echo "❌ API Gateway 健康检查失败"
              else
                sleep 5
              fi
            done

            echo "=== 容器日志（最近错误） ==="
            docker-compose logs --tail=20 | grep -i error || echo "未发现错误日志"

            # 检查外部访问
            echo "=== 外部访问测试 ==="
            curl -s -o /dev/null -w "前端服务(3000): %{http_code}\n" http://localhost:3000 || echo "前端服务不可访问"
            curl -s -o /dev/null -w "API网关(8080): %{http_code}\n" http://localhost:8080 || echo "API网关不可访问"

            # 清理临时文件
            echo "清理临时文件..."
            rm -f *.tar

            echo "🎉 部署完成！"
            echo "📊 服务访问地址："
            echo "  前端应用: http://101.132.34.91:3000"
            echo "  API网关: http://101.132.34.91:8080"
            echo "  User服务: http://101.132.34.91:8081"
            echo "  QA服务: http://101.132.34.91:8082"
            echo "  数据库: 101.132.34.91:3306"


            