# 工作流的名称，会显示在 GitHub Actions 的 UI 界面中
name: CI/CD for AI QA System

# 工作流的触发条件
on:
  # 当有代码推送到 main 分支时触发
  push:
    branches: ["aliyun"]
  # 当有针对 main 分支的 Pull Request 被创建或更新时触发
  pull_request:
    branches: ["aliyun"]

# 定义工作流中的所有任务 (Jobs)
jobs:
  # --- 第一个任务：构建并测试后端微服务 ---
  build-and-test-backend:
    # 任务的名称，会显示在 UI 中
    name: Build and Test Backend Services
    # 运行此任务所需的虚拟机环境
    runs-on: ubuntu-latest

    # 任务的执行步骤
    steps:
      # 步骤 1: 检出代码
      # 使用官方的 actions/checkout@v4 action 来获取仓库的最新代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2: 设置 Java 环境
      # 使用官方的 actions/setup-java@v4 action 来安装和配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 步骤 3: 缓存 Maven 依赖
      # 为了加速构建，缓存下载过的 Maven 依赖包。
      # 这样下次构建时，如果 pom.xml 没有变化，就可以直接使用缓存，节省大量时间。
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 步骤 4: 使用 Maven 构建和测试
      # -B: Batch mode，避免交互式提示
      # clean package: 执行清理、编译、测试、打包等所有操作
      - name: Build with Maven
        run: |
          cd backend-services
          # 使用父pom.xml构建所有子模块
          mvn -B clean package

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: |
            backend-services/api-gateway/target/*.jar
            backend-services/user-service/target/*.jar
            backend-services/qa-service/target/*.jar
          retention-days: 1

  # --- 第二个任务：构建 Docker 镜像并直接传输到ECS ---
  build-and-transfer-images:
    # 任务的名称
    name: Build and Transfer Docker Images
    # 运行此任务所需的虚拟机环境
    runs-on: ubuntu-latest

    # 依赖关系：这个任务必须在 `build-and-test-backend` 成功完成后才能开始
    needs: build-and-test-backend

    # 任务的执行步骤
    steps:
      # 步骤 1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-artifacts
          path: backend-services

      # 步骤 2: 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 3: 构建 Docker 镜像（不推送）
      - name: Build API Gateway image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-api-gateway:latest ./backend-services/api-gateway

      - name: Build User Service image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-user-service:latest ./backend-services/user-service

      - name: Build QA Service image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-qa-service:latest ./backend-services/qa-service

      - name: Build Frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-frontend:latest \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://101.132.179.6:8080 \
            ./frontend-nextjs/frontend

      # 步骤 4: 保存 Docker 镜像为 tar 文件
      - name: Save Docker images to tar files
        run: |
          docker save -o api-gateway.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-api-gateway:latest
          docker save -o user-service.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-user-service:latest
          docker save -o qa-service.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-qa-service:latest
          docker save -o frontend.tar ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-frontend:latest
          ls -lh *.tar

      # 步骤 5: 上传 docker-compose.yml 到 ECS 服务器
      - name: Upload docker-compose.yml to Aliyun ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/aiqasystem-cicd/"
          overwrite: true
          timeout: 300s # ← 加单位
          command_timeout: 300s # ← 加单位

      # 步骤 6: 上传 Docker 镜像文件到 ECS
      - name: Upload Docker images to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "*.tar"
          target: "~/aiqasystem-cicd/"
          timeout: 600s # ← 加单位
          command_timeout: 600s # ← 加单位

      # 步骤 7: 部署到 Aliyun ECS 服务器
      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_ECS_HOST }}
          username: ${{ secrets.ALIYUN_ECS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 1800s # 增加整体脚本超时时间到30分钟
          script: |
            cd ~/aiqasystem-cicd

            echo "=== 停止现有服务 ==="
            timeout 60s docker-compose down --volumes --remove-orphans || true

            echo "=== 清理旧镜像 ==="
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-api-gateway:latest 2>/dev/null || true
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-user-service:latest 2>/dev/null || true
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-qa-service:latest 2>/dev/null || true
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/ai-qa-frontend:latest 2>/dev/null || true
            docker image prune -f

            echo "=== 加载 Docker 镜像 ==="
            docker load -i api-gateway.tar
            docker load -i user-service.tar
            docker load -i qa-service.tar
            docker load -i frontend.tar

            echo "=== 检查镜像加载情况 ==="
            docker images | grep ai-qa

            echo "=== 启动所有服务 ==="
            docker-compose up -d

            echo "=== 等待服务启动（使用健康检查）==="

            # 等待数据库健康
            echo "等待数据库启动..."
            for i in {1..30}; do
                if docker-compose ps database | grep -q "(healthy)"; then
                    echo "✅ 数据库已健康"
                    break
                fi
                echo "等待数据库健康... ($i/30)"
                sleep 10
            done

            # 等待用户服务健康
            echo "等待用户服务启动..."
            for i in {1..30}; do
                if docker-compose ps user-service | grep -q "(healthy)"; then
                    echo "✅ 用户服务已健康"
                    break
                fi
                echo "等待用户服务健康... ($i/30)"
                sleep 10
            done

            # 等待QA服务健康
            echo "等待QA服务启动..."
            for i in {1..30}; do
                if docker-compose ps qa-service | grep -q "(healthy)"; then
                    echo "✅ QA服务已健康"
                    break
                fi
                echo "等待QA服务健康... ($i/30)"
                sleep 10
            done

            # 等待API网关健康 - 增加更多重试
            echo "等待API网关启动..."
            for i in {1..30}; do
                if docker-compose ps api-gateway | grep -q "(healthy)"; then
                    echo "✅ API网关已健康"
                    break
                fi
                echo "等待API网关健康... ($i/30)"
                sleep 10
            done

            # 等待前端健康
            echo "等待前端启动..."
            for i in {1..30}; do
                if docker-compose ps frontend | grep -q "(healthy)"; then
                    echo "✅ 前端已健康"
                    break
                fi
                echo "等待前端健康... ($i/30)"
                sleep 30
            done

            echo "=== 最终服务状态 ==="
            docker-compose ps

            echo "=== 健康检查汇总 ==="
            curl -f http://localhost:8081/actuator/health >/dev/null 2>&1 && echo "✅ User Service 健康" || echo "❌ User Service 异常"
            curl -f http://localhost:8082/actuator/health >/dev/null 2>&1 && echo "✅ QA Service 健康" || echo "❌ QA Service 异常"
            curl -f http://localhost:8080/actuator/health >/dev/null 2>&1 && echo "✅ API Gateway 健康" || echo "❌ API Gateway 异常"
            curl -f http://localhost:3000 >/dev/null 2>&1 && echo "✅ Frontend 健康" || echo "❌ Frontend 异常"

            echo "🎉 部署完成！"
