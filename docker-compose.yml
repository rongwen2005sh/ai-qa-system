services:
  # MySQL 数据库
  database:
    image: mysql:8.0
    container_name: ai-qa-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ai-qa-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      timeout: 20s
      retries: 10
      start_period: 30s

  # User Service - 使用 root 用户连接
  user-service:
    image: ${DOCKERHUB_USERNAME}/ai-qa-user-service:latest
    container_name: ai-qa-user-service
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - ai-qa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      timeout: 10s
      retries: 5
      start_period: 20s

  # QA Service - 使用 root 用户连接
  qa-service:
    image: ${DOCKERHUB_USERNAME}/ai-qa-qa-service:latest
    container_name: ai-qa-qa-service
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    networks:
      - ai-qa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      timeout: 10s
      retries: 5
      start_period: 20s

  # API Gateway
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/ai-qa-api-gateway:latest
    container_name: ai-qa-api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      qa-service:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://101.132.179.6:8080
    networks:
      - ai-qa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5
      start_period: 30s

  # Frontend
  frontend:
    image: ${DOCKERHUB_USERNAME}/ai-qa-frontend:latest
    container_name: ai-qa-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://101.132.179.6:8080
    networks:
      - ai-qa-network

volumes:
  db_data:

networks:
  ai-qa-network:
    driver: bridge
